<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><rect width="100%" height="100%" fill="white"/><text x="80" y="35" font-size="24" font-weight="700" fill="#222222">What explains the Year-1 revenue collapse?</text><text x="80" y="57" font-size="14" fill="#666666">2022 to 2024 decomposition using first-order discount bands.</text><rect x="80" y="90.04166124509342" width="140" height="119.35350527064205" fill="#13b889"/><text x="150.0" y="82.04166124509342" text-anchor="middle" font-size="14" fill="#222222">SGD 238</text><text x="150.0" y="328" text-anchor="middle" font-size="13" fill="#666666">2022 Y1 Rev</text><rect x="290" y="90.04166124509342" width="140" height="46.990550014266745" fill="#e23b2e"/><text x="360.0" y="155.03221125936017" text-anchor="middle" font-size="14" fill="#e23b2e">SGD -94</text><text x="360.0" y="328" text-anchor="middle" font-size="13" fill="#666666">Mix shift</text><rect x="500" y="137.03221125936017" width="140" height="23.59345284745109" fill="#e23b2e"/><text x="570.0" y="178.62566410681126" text-anchor="middle" font-size="14" fill="#e23b2e">SGD -47</text><text x="570.0" y="328" text-anchor="middle" font-size="13" fill="#666666">Within-band quality</text><rect x="710" y="160.62566410681126" width="140" height="48.76950240892421" fill="#1676bf"/><text x="780.0" y="152.62566410681126" text-anchor="middle" font-size="14" fill="#222222">SGD 97</text><text x="780.0" y="328" text-anchor="middle" font-size="13" fill="#666666">2024 Y1 Rev</text><text x="80" y="352" font-size="14" fill="#222222">Discount-depth mix explains SGD 94; within-band quality explains SGD 47.</text></svg>